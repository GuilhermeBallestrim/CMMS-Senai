services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cmms-backend
    ports:
      - "8000:8000"
    environment:
      - CMMS_ENV=${CMMS_ENV:-production}
      - CMMS_SUPABASE_URL=${CMMS_SUPABASE_URL:?defina CMMS_SUPABASE_URL no .env ou no ambiente}
      - CMMS_SUPABASE_KEY=${CMMS_SUPABASE_KEY:?defina CMMS_SUPABASE_KEY no .env ou no ambiente}
      - CMMS_SESSION_SECRET=${CMMS_SESSION_SECRET:?defina CMMS_SESSION_SECRET no .env ou no ambiente}
      - CMMS_DEBUG=${CMMS_DEBUG:-false}
    # Antes de subir, aplique supabase_schema.sql no SQL Editor do Supabase.
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks:
      - cmms-network

  nginx:
    image: nginx:1.27-alpine
    container_name: cmms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cmms-network

networks:
  cmms-network:
    driver: bridge