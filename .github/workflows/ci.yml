name: CI

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Block unresolved merge conflicts
        run: |
          if (Select-String -Path (Get-ChildItem -Recurse -Include *.py,.gitignore,*.yml,*.yaml,*.md,*.sql -File) -Pattern "^<<<<<<< |^======= |^>>>>>>> " -ErrorAction SilentlyContinue) {
            Write-Error "Unresolved merge conflict markers found."
            exit 1
          }

      - name: Syntax check
        run: python -m compileall -q main.py backend

      - name: Run tests
        env:
          CMMS_SESSION_SECRET: ci-secret
          CMMS_ENV: development
          CMMS_SUPABASE_URL: ${{ secrets.CMMS_SUPABASE_URL }}
          CMMS_SUPABASE_KEY: ${{ secrets.CMMS_SUPABASE_KEY }}
        run: python -m unittest discover -s tests